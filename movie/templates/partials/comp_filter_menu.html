<!-- ================= templates/partials/comp_filter_menu.html (통합 오프캔버스 필터) ================= -->

<button class="btn btn-sm text-secondary bg-white border ms-auto flex-shrink-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterOffcanvas" aria-controls="filterOffcanvas" style="height: 28px !important; padding: 0 10px !important; font-size: 12px; border-radius: 6px; border-color: #e2e8f0 !important; white-space: nowrap; line-height: normal !important;">
    <i class="bi bi-funnel-fill me-1"></i> 통합 필터
</button>

<div class="offcanvas offcanvas-end" tabindex="-1" id="filterOffcanvas" aria-labelledby="filterOffcanvasLabel" style="width: 420px; max-width: 90vw;">
    
    <div class="offcanvas-header border-bottom border-light-subtle px-4">
        <h5 class="offcanvas-title fw-bold" id="filterOffcanvasLabel"><i class="bi bi-funnel-fill text-primary me-2"></i>상세 필터</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    
    <div class="offcanvas-body custom-scrollbar px-4 pt-4 pb-0 bg-light">
        <form method="GET" id="unified-filter-form" action="{% url 'all_list' %}">
            <input type="hidden" name="type" value="{{ current_type|default:'movie' }}">
            <input type="hidden" name="filter_submitted" value="true">
            <input type="hidden" name="sort" value="{{ sort_by|default:'votes_desc' }}">
            {% if search_query %}<input type="hidden" name="search" value="{{ search_query }}">{% endif %}
            
            <!-- ================= [1. 평점 슬라이더 (0~10 추가)] ================= -->
            <div class="filter-section mb-5">
                <h6 class="fw-bold mb-3 ms-1">⭐ 평점</h6>
                <div class="dual-slider-container" id="slider-rating">
                    <div class="slider-track"></div>
                    <!-- 💡 0을 추가하고 초기 디폴트는 1~10으로 셋팅! -->
                    <input type="range" name="rating_min" min="0" max="10" value="{{ request.GET.rating_min|default:'1' }}" id="rating-min">
                    <input type="range" name="rating_max" min="0" max="10" value="{{ request.GET.rating_max|default:'10' }}" id="rating-max">
                </div>
                <!-- 💡 0이 추가된 눈금! -->
                <div class="d-flex justify-content-between text-muted mt-2 fw-bold px-1" style="font-size: 12px;">
                    <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
                </div>
            </div>

            <!-- ================= [2. 기간 슬라이더] ================= -->
            <div class="filter-section mb-3"> <!-- 💡 mb-5를 mb-3으로 줄여서 아래 간격 축소 -->
                <h6 class="fw-bold mb-3 ms-1">📅 기간</h6>
                <div class="dual-slider-container" id="slider-period">
                    <div class="slider-track"></div>
                    <input type="range" name="period_min_idx" min="0" max="8" value="{{ request.GET.period_min_idx|default:'0' }}" id="period-min">
                    <input type="range" name="period_max_idx" min="0" max="8" value="{{ request.GET.period_max_idx|default:'8' }}" id="period-max">
                </div>
                
                <!-- 💡 [핵심] justify-content-between 대신 % 절대 좌표 사용 -->
                <!-- 💡 [해결] nowrap으로 줄바꿈 방지, 자간 축소, 좌표 미세 조정 -->
                <div class="position-relative text-muted mt-2 fw-bold w-100" style="height: 20px; font-size: 10.5px; letter-spacing: -0.5px; white-space: nowrap;">
                    <!-- 💡 겹침 방지를 위해 첫 번째 항목을 '전체'로 변경하시는 것도 UX적으로 추천드립니다 (현재는 유지) -->
                    <span style="position: absolute; left: 0%; transform: translateX(0%);">이전</span>
                    
                    <!-- 💡 '15년'의 위치를 오른쪽으로 살짝(-35%) 밀어서 '15년↑'과 부딪히지 않게 여백 확보 -->
                    <span style="position: absolute; left: 12.5%; transform: translateX(-35%);">15년</span>
                    
                    <span style="position: absolute; left: 25%; transform: translateX(-50%);">10년</span>
                    <span style="position: absolute; left: 37.5%; transform: translateX(-50%);">5년</span>
                    <span style="position: absolute; left: 50%; transform: translateX(-50%);">3년</span>
                    <span style="position: absolute; left: 62.5%; transform: translateX(-50%);">2년</span>
                    <span style="position: absolute; left: 75%; transform: translateX(-50%);">1년</span>
                    <span style="position: absolute; left: 87.5%; transform: translateX(-50%);">6개월</span>
                    
                    <!-- 💡 오른쪽 끝에서 줄바꿈 없이 꼬리가 딱 맞도록 -100% 유지 -->
                    <span style="position: absolute; left: 100%; transform: translateX(-100%);">3개월</span>
                </div>
            </div>

            <!-- ================= [3. 연령 슬라이더] ================= -->
            <div class="filter-section mb-5">
                <h6 class="fw-bold mb-3 ms-1">🔞 관람등급</h6>
                <div class="dual-slider-container" id="slider-age">
                    <div class="slider-track"></div>
                    <input type="range" name="age_min_idx" min="0" max="3" value="{{ request.GET.age_min_idx|default:'0' }}" id="age-min">
                    <input type="range" name="age_max_idx" min="0" max="3" value="{{ request.GET.age_max_idx|default:'3' }}" id="age-max">
                </div>
                <div class="d-flex justify-content-between text-muted mt-2 fw-bold px-1" style="font-size: 12px;">
                    <span>전체</span><span>12</span><span>15</span><span>19</span>
                </div>
            </div>

            <!-- ================= [4. OTT 선택] ================= -->
            <div class="filter-section mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3 ms-1">
                    <h6 class="fw-bold mb-0">📺 스트리밍 (OTT)</h6>
                    <button type="button" class="btn btn-sm btn-link text-decoration-none text-muted fw-bold p-0 m-0 top-toggle-btn d-none" style="font-size: 12px;" data-target="grid-ott" onclick="toggleGrid('grid-ott')">- 접기</button>
                </div>
                <div class="filter-grid collapsed" id="grid-ott">
                    {% for ott in otts_list %}
                        <!-- 💡 p-2를 py-2 px-1로 변경하여 좌우 여백 절반 축소 -->
                        <label class="grid-item form-check bg-white rounded-3 py-2 px-1 m-0 border d-flex align-items-center shadow-sm" style="cursor: pointer;">
                            <!-- 💡 체크박스 마진 축소 (ms-1 me-2 -> m-0 me-1) -->
                            <input class="form-check-input m-0 me-1" type="checkbox" name="otts" value="{{ ott.id }}" {% if ott.id in selected_otts %}checked{% endif %}>
                            
                            {% if ott.id|lower == 'watcha' %}<img src="/static/images/WATCHA_icon_Square.png" style="width: 16px; height: 16px; border-radius: 4px; object-fit: cover;" alt="Watcha">
                            {% elif ott.id|lower == 'wavve' %}<img src="/static/images/Wavve_icon.png" style="width: 16px; height: 16px; border-radius: 4px; object-fit: cover;" alt="Wavve">
                            {% elif ott.logo %}<img src="{{ ott.logo }}" style="width: 16px; height: 16px; border-radius: 4px; object-fit: cover;" alt="{{ ott.name }}">
                            
                            <!-- 💡 [해결] 로고가 없는 OTT는 이름을 조합해 자동으로 파비콘을 가져옵니다 (블러드스트림, 케이블원 해결) -->
                            {% else %}<img src="https://www.google.com/s2/favicons?domain={{ ott.id|lower|cut:' ' }}.com&sz=128" style="width: 16px; height: 16px; border-radius: 4px; object-fit: cover;" alt="{{ ott.name }}">{% endif %}
                            
                            <!-- 💡 text-nowrap 추가로 줄바꿈 원천 차단 & 폰트 12px로 최적화 -->
                            <span class="ms-1 small text-dark fw-medium text-nowrap" style="font-size: 12px; letter-spacing: -0.3px;">{{ ott.name }}</span>
                        </label>
                    {% endfor %}
                </div>
                <button type="button" class="btn btn-sm btn-link text-decoration-none w-100 text-muted mt-2 fw-bold bottom-toggle-btn" data-target="grid-ott" onclick="toggleGrid('grid-ott')">+ 더 보기</button>
            </div>

            <!-- ================= [5. 장르 선택] ================= -->
            <div class="filter-section mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3 ms-1">
                    <h6 class="fw-bold mb-0">🎬 장르</h6>
                    <button type="button" class="btn btn-sm btn-link text-decoration-none text-muted fw-bold p-0 m-0 top-toggle-btn d-none" style="font-size: 12px;" data-target="grid-genre" onclick="toggleGrid('grid-genre')">- 접기</button>
                </div>
                <div class="filter-grid collapsed" id="grid-genre" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
                    {% for genre in genres_list %}
                        <!-- 💡 py-2 px-1 좌우 여백 축소 -->
                        <label class="grid-item form-check bg-white rounded-3 py-2 px-1 m-0 border d-flex align-items-center shadow-sm" style="cursor: pointer;">
                            <input class="form-check-input m-0 me-1 genre-cb" type="checkbox" name="genres" value="{{ genre }}" {% if genre in selected_genres %}checked{% endif %}>
                            <!-- 💡 text-nowrap 줄바꿈 방지 -->
                            <span class="small text-dark fw-medium text-nowrap" style="font-size: 12px; letter-spacing: -0.3px;">{{ genre }}</span>
                        </label>
                    {% endfor %}
                </div>
                <button type="button" class="btn btn-sm btn-link text-decoration-none w-100 text-muted mt-2 fw-bold bottom-toggle-btn" data-target="grid-genre" onclick="toggleGrid('grid-genre')">+ 더 보기</button>
            </div>

            <!-- ================= [6. 국가 선택] ================= -->
            <div class="filter-section mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3 ms-1">
                    <h6 class="fw-bold mb-0">🌍 국가</h6>
                    <button type="button" class="btn btn-sm btn-link text-decoration-none text-muted fw-bold p-0 m-0 top-toggle-btn d-none" style="font-size: 12px;" data-target="grid-country" onclick="toggleGrid('grid-country')">- 접기</button>
                </div>
                <div class="filter-grid collapsed" id="grid-country" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
                    {% for country in countries_list %}
                        <!-- 💡 py-2 px-1 좌우 여백 축소 -->
                        <label class="grid-item form-check bg-white rounded-3 py-2 px-1 m-0 border d-flex align-items-center shadow-sm" style="cursor: pointer;">
                            <input class="form-check-input m-0 me-1" type="checkbox" name="countries" value="{{ country.id }}" {% if country.id in selected_countries %}checked{% endif %}>
                            <!-- 💡 국기 사이즈 미세 축소 (가로폭 확보) -->
                            <img src="{{ country.flag }}" alt="{{ country.name }}" style="width: 18px; height: 13px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 1px rgba(0,0,0,0.3);">
                            <!-- 💡 text-nowrap으로 4글자(이탈리아, 아일랜드) 절대 줄바꿈 방지 -->
                            <span class="ms-1 small text-dark fw-medium text-nowrap" style="font-size: 12px; letter-spacing: -0.3px;">{{ country.name }}</span>
                        </label>
                    {% endfor %}
                </div>
                <button type="button" class="btn btn-sm btn-link text-decoration-none w-100 text-muted mt-2 fw-bold bottom-toggle-btn" data-target="grid-country" onclick="toggleGrid('grid-country')">+ 더 보기</button>
            </div>

            <!-- ================= [7. 제외 옵션] ================= -->
            <div class="filter-section mb-3">
                <h6 class="fw-bold mb-3 ms-1">🚫 제외 옵션</h6>
                <div class="d-flex flex-column gap-2 ms-1">
                    <!-- 💡 value="true"를 value="on"으로 일괄 수정하여 백엔드 버그 완벽 차단! -->
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input m-0" type="checkbox" name="exclude_rated" id="exc-rated" value="on" style="width: 18px; height: 18px;" {% if exclude_rated %}checked{% endif %}>
                        <label class="form-check-label ms-2 small fw-medium text-dark" for="exc-rated">내가 평가한 영화 제외</label>
                    </div>
                    
                    <!-- 💡 평점 제외 및 무평점 제외 HTML 숨김 처리 -->
                    <!--
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input m-0" type="checkbox" name="exclude_no_rating" id="exc-no-rating" value="on" style="width: 18px; height: 18px;" {% if filter_submitted != 'true' or exclude_no_rating %}checked{% endif %}>
                        <label class="form-check-label ms-2 small fw-medium text-dark" for="exc-no-rating">IMDb 무평점 제외</label>
                    </div>
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input m-0" type="checkbox" name="exclude_low_rating" id="exc-low-rating" value="on" style="width: 18px; height: 18px;" {% if filter_submitted != 'true' or exclude_low_rating %}checked{% endif %}>
                        <label class="form-check-label ms-2 small fw-medium text-dark" for="exc-low-rating">IMDb 평점 5점 미만 제외</label>
                    </div>
                    -->

                    <div class="form-check d-flex align-items-center" style="display: none !important;">
                        <input class="form-check-input m-0" type="checkbox" name="exclude_low_votes" id="exc-low-votes" value="on" style="width: 18px; height: 18px;" {% if filter_submitted != 'true' or exclude_low_votes %}checked{% endif %}>
                        <label class="form-check-label ms-2 small fw-medium text-dark" for="exc-low-votes">IMDb 평가 100개 미만 제외</label>
                    </div>
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input m-0" type="checkbox" name="exclude_doc" id="exc-doc" value="on" style="width: 18px; height: 18px;" {% if filter_submitted != 'true' or exclude_doc %}checked{% endif %}>
                        <label class="form-check-label ms-2 small fw-medium text-dark" for="exc-doc">다큐멘터리 제외</label>
                    </div>
                    <div class="form-check d-flex align-items-center" style="display: none !important;">
                        <input class="form-check-input m-0" type="checkbox" name="exclude_short" id="exc-short" value="on" style="width: 18px; height: 18px;" {% if filter_submitted != 'true' or exclude_short %}checked{% endif %}>
                        <label class="form-check-label ms-2 small fw-medium text-dark" for="exc-short">상영시간 60분 이하 제외</label>
                    </div>
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input m-0" type="checkbox" name="exclude_unreleased" id="exc-unreleased" value="on" style="width: 18px; height: 18px;" {% if filter_submitted != 'true' or exclude_unreleased %}checked{% endif %}>
                        <label class="form-check-label ms-2 small fw-medium text-dark" for="exc-unreleased">미개봉작 제외</label>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- 서랍 푸터 -->
    <div class="offcanvas-footer bg-light px-4 pt-3 border-top border-light-subtle shadow-lg" style="padding-bottom: 56px !important;">
        <div class="d-flex gap-2">
            <a href="{% url 'all_list' %}?type={{ current_type|default:'movie' }}" class="btn btn-outline-secondary fw-bold py-2 rounded-3" style="width: 30%;">초기화</a>
            <button type="submit" form="unified-filter-form" class="btn btn-dark fw-bold py-2 rounded-3 shadow-sm" style="width: 70%; background-color: #0f172a;">필터 적용하기</button>
        </div>
    </div>
</div>

<!-- ================= [필터 전용 CSS] ================= -->
<style>
    .filter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .filter-grid.collapsed .grid-item:nth-child(n+7) { display: none !important; }
    
    .dual-slider-container { position: relative; width: 100%; height: 26px; margin-top: 10px; }
    .dual-slider-container .slider-track {
        position: absolute; width: 100%; height: 6px; background-color: #e2e8f0;
        border-radius: 5px; top: 10px; z-index: 1; pointer-events: none;
    }
    .dual-slider-container input[type="range"] {
        position: absolute; width: 100%; top: 0px; height: 26px; -webkit-appearance: none; pointer-events: none;
        background: transparent; z-index: 2; outline: none; margin: 0; padding: 0;
    }
    .dual-slider-container input[type="range"]::-webkit-slider-thumb {
        pointer-events: all; width: 24px; height: 24px; -webkit-appearance: none;
        background-color: #fff; border: 3px solid #0f172a; border-radius: 50%;
        cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .dual-slider-container input[type="range"]::-moz-range-thumb {
        pointer-events: all; width: 24px; height: 24px; background-color: #fff;
        border: 3px solid #0f172a; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
</style>

<!-- ================= [필터 전용 JS] ================= -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        initDualSlider('slider-rating');
        initDualSlider('slider-period');
        initDualSlider('slider-age');

        // 💡 [기능 추가] 다큐멘터리 장르 선택 시 제외 옵션 강제 해제 로직
        const genreCheckboxes = document.querySelectorAll('.genre-cb');
        const excludeDocCb = document.getElementById('exc-doc');
        genreCheckboxes.forEach(cb => {
            cb.addEventListener('change', function() {
                if (this.value === '다큐멘터리' && this.checked && excludeDocCb) {
                    excludeDocCb.checked = false; // 다큐 제외 스위치를 강제로 끕니다!
                }
            });
        });
    });

    function initDualSlider(containerId) {
        const container = document.getElementById(containerId);
        if(!container) return;
        const minSlider = container.querySelector('input[name$="_min"], input[name$="_min_idx"]');
        const maxSlider = container.querySelector('input[name$="_max"], input[name$="_max_idx"]');
        const track = container.querySelector('.slider-track');

        function updateSlider() {
            let minVal = parseInt(minSlider.value);
            let maxVal = parseInt(maxSlider.value);

            if (minVal > maxVal) {
                if (this === minSlider) { maxSlider.value = minVal; maxVal = minVal; }
                else if (this === maxSlider) { minSlider.value = maxVal; minVal = maxVal; }
            }

            const minPercent = ((minVal - minSlider.min) / (minSlider.max - minSlider.min)) * 100;
            const maxPercent = ((maxVal - maxSlider.min) / (maxSlider.max - maxSlider.min)) * 100;
            track.style.background = `linear-gradient(to right, #e2e8f0 ${minPercent}%, #0f172a ${minPercent}%, #0f172a ${maxPercent}%, #e2e8f0 ${maxPercent}%)`;

            // Z-index 교정 로직 (뭉침 풀기)
            if (maxVal === parseInt(maxSlider.max)) {
                minSlider.style.zIndex = "3"; maxSlider.style.zIndex = "2";
            } else {
                minSlider.style.zIndex = "2"; maxSlider.style.zIndex = "3";
            }
        }

        minSlider.addEventListener('input', updateSlider);
        maxSlider.addEventListener('input', updateSlider);
        updateSlider(); 
    }

    function toggleGrid(gridId) {
        const grid = document.getElementById(gridId);
        const isCollapsed = grid.classList.contains('collapsed');
        const topBtn = document.querySelector(`.top-toggle-btn[data-target="${gridId}"]`);
        const bottomBtn = document.querySelector(`.bottom-toggle-btn[data-target="${gridId}"]`);
        
        if (isCollapsed) {
            grid.classList.remove('collapsed');
            if(topBtn) topBtn.classList.remove('d-none');
            if(bottomBtn) bottomBtn.textContent = "- 접기";
        } else {
            grid.classList.add('collapsed');
            if(topBtn) topBtn.classList.add('d-none');
            if(bottomBtn) bottomBtn.textContent = "+ 더 보기";
        }
    }
</script>
