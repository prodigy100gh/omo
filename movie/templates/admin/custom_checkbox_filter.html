{% load i18n %}
<div class="custom-dropdown-filter" data-param="{{ spec.parameter_name }}" style="position: relative; display: inline-block; margin-right: 10px;">
    
    <!-- 💡 1. 평소에 보이는 드롭다운 버튼 -->
    <button type="button" class="dropdown-toggle-btn" style="padding: 6px 12px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; font-size: 13px; color: #333;">
        {{ title }} ▼
    </button>

    <!-- 💡 2. 클릭하면 나타나는 체크박스 팝업 (기본은 display: none) -->
    <div class="dropdown-menu-content" style="display: none; position: absolute; top: 100%; left: 0; background: white; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 9999; min-width: 220px; max-height: 400px; overflow-y: auto; padding: 10px; border-radius: 4px; margin-top: 4px;">
        
        <!-- 전체 보기 (초기화) 버튼 -->
        <div style="margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            {% for choice in choices %}
                {% if choice.value == '' %}
                    <a href="{{ choice.query_string }}" style="font-weight:bold; color:#007bff; text-decoration: none; display: block; text-align: center;">
                        {{ choice.display }}
                    </a>
                {% endif %}
            {% endfor %}
        </div>

        <!-- 다중 선택 체크박스 리스트 -->
        <ul style="margin: 0; padding: 0; list-style: none;">
            {% for choice in choices %}
                {% if choice.value != '' %}
                    <li style="margin-bottom: 8px;">
                        <label style="cursor: pointer; display: flex; align-items: center; font-size: 13px; color: #444;">
                            <input type="checkbox" value="{{ choice.value }}" {% if choice.selected %}checked{% endif %} class="filter-checkbox" style="margin-right: 8px; cursor: pointer;">
                            {{ choice.display }}
                        </label>
                    </li>
                {% endif %}
            {% endfor %}
        </ul>
        
        <!-- 적용하기 버튼 (항상 아래 고정) -->
        <div style="margin-top: 15px; position: sticky; bottom: -10px; background: white; padding-bottom: 10px; border-top: 1px solid #eee; padding-top: 10px;">
            <button type="button" class="apply-filter-btn" style="width: 100%; padding: 8px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold;">
                적용하기
            </button>
        </div>
    </div>
</div>

<script>
    if (!window.customDropdownInit) {
        window.customDropdownInit = true;

        document.addEventListener('click', function(e) {
            // 1️⃣ 버튼 클릭 시 드롭다운 팝업 열기/닫기
            if (e.target.classList.contains('dropdown-toggle-btn')) {
                const content = e.target.nextElementSibling;
                const isVisible = content.style.display === 'block';
                
                // 다른 열려있는 드롭다운이 있다면 닫기
                document.querySelectorAll('.dropdown-menu-content').forEach(el => el.style.display = 'none');
                
                content.style.display = isVisible ? 'none' : 'block';
                e.stopPropagation(); // 바탕화면 클릭 이벤트와 충돌 방지
            } 
            // 2️⃣ 적용하기 버튼 클릭 시 URL 업데이트 및 새로고침
            else if (e.target.classList.contains('apply-filter-btn')) {
                const filterBox = e.target.closest('.custom-dropdown-filter');
                const paramName = filterBox.getAttribute('data-param');
                const checkboxes = filterBox.querySelectorAll('input.filter-checkbox:checked');
                
                const values = Array.from(checkboxes).map(cb => cb.value).join(',');
                const url = new URL(window.location.href);
                
                if (values) {
                    url.searchParams.set(paramName, values);
                } else {
                    url.searchParams.delete(paramName);
                }
                
                window.location.href = url.toString();
            }
            // 3️⃣ 드롭다운 바깥(허공)을 클릭하면 팝업 닫기
            else {
                if (!e.target.closest('.custom-dropdown-filter')) {
                    document.querySelectorAll('.dropdown-menu-content').forEach(el => el.style.display = 'none');
                }
            }
        });
    }
</script>
